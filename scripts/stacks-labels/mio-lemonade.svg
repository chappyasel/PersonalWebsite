<svg xmlns="http://www.w3.org/2000/svg" width="768" height="640" viewBox="0 0 768 640">
  <!--
    MiO Lemonade (3.24 fl oz, the "2X more" bottle) skin for
    scene/MioBottle.tsx. Same chart as mio-hydrate.svg: u once around (front at
    x = 384), v = height. Layout measured off the packshot (measure_mio.py):
      cap          0.87..1.00  -> y   0..83   (the 2X MORE disc sits on it)
      "mio"        0.45..0.60  -> y 256..352
      band top     0.27        -> y 467
      LEMONADE     0.18..0.24  -> y 486..525
      3.24 FL OZ   0.10..0.15  -> y 544..576
    Front text sized to arc fractions of the seen width (u 0.25..0.75).
    Rasterised by scripts/stacks-labels.mjs.
  -->
  <rect width="768" height="640" fill="#2aa6e0"/>
  <!-- cap -->
  <rect width="768" height="83" fill="#1f1f8c"/>
  <rect y="80" width="768" height="5" fill="#18176e"/>
  <!-- lower band with a gentle wave -->
  <path d="M0 474 Q192 458 384 468 Q576 478 768 462 L768 640 L0 640 Z" fill="#f2d13c"/>
  <!-- base rim -->
  <rect y="618" width="768" height="22" fill="#e8e2c8"/>
  <!-- back panel (seam side) -->
  <g transform="translate(40 150)">
    <rect width="150" height="270" rx="10" fill="#ffffff"/>
    <g fill="#1f1f8c">
      <rect x="14" y="16" width="122" height="16"/>
      <rect x="14" y="46" width="90" height="5"/><rect x="14" y="60" width="110" height="5"/><rect x="14" y="74" width="70" height="5"/>
      <rect x="14" y="96" width="122" height="3"/>
      <rect x="14" y="110" width="100" height="5"/><rect x="14" y="124" width="120" height="5"/><rect x="14" y="138" width="80" height="5"/>
      <rect x="14" y="160" width="122" height="3"/>
      <rect x="14" y="174" width="110" height="5"/><rect x="14" y="188" width="60" height="5"/><rect x="14" y="202" width="100" height="5"/>
      <rect x="14" y="224" width="122" height="5"/>
      <rect x="14" y="244" width="90" height="5"/>
    </g>
  </g>
  <!-- 2X MORE disc over the cap/shoulder -->
  <circle cx="384" cy="78" r="42" fill="#1f1f8c"/>
  <text x="384" y="80" text-anchor="middle" font-family="Impact, Arial Black, Arial" font-size="34" fill="#ffffff">2X</text>
  <text x="384" y="102" text-anchor="middle" font-family="Impact, Arial Black, Arial" font-size="16" fill="#ffffff" letter-spacing="1">MORE</text>
  <!-- mio wordmark -->
  <text x="384" y="340" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial" font-weight="700" font-size="100" fill="#1f1f8c" letter-spacing="-3">mio</text>
  <!-- band copy -->
  <text x="384" y="520" text-anchor="middle" font-family="Impact, Arial Black, Arial" font-size="37" fill="#1f1f8c" letter-spacing="1.5">LEMONADE</text>
  <text x="352" y="572" text-anchor="end" font-family="Impact, Arial Black, Arial" font-size="30" fill="#1f1f8c">3.24</text>
  <text x="352" y="586" text-anchor="end" font-family="Impact, Arial Black, Arial" font-size="12" fill="#1f1f8c" letter-spacing="1">FL OZ</text>
  <g fill="#1f1f8c"><rect x="358" y="550" width="2" height="6"/><rect x="358" y="564" width="2" height="6"/><rect x="358" y="578" width="2" height="6"/></g>
  <g font-family="Impact, Arial Black, Arial" fill="#1f1f8c" letter-spacing="0.5">
    <text x="366" y="558" font-size="11">NATURAL FLAVOR WITH</text>
    <text x="366" y="572" font-size="11">OTHER NATURAL FLAVOR</text>
    <text x="366" y="586" font-size="10">LIQUID WATER ENHANCER</text>
  </g>
</svg>
