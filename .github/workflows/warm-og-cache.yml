name: Warm book OG image cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read
  deployments: read

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      # This used to read the aggregate commit status and exit 1 on `failure`,
      # which meant the warmer showed red for a broken deploy and would have
      # shown red for any unrelated check that ever started reporting a status
      # on main. Read the production deployment itself instead.
      #
      # Verified read-only against this repository on 2026-08-21: every push to
      # main carries deployments created by vercel[bot] with environment
      # "Production", and pushes that also have a preview carry a second
      # deployment with environment "Preview" that this selector skips
      # (4ab4d70 has both). The aggregate status has exactly one context today,
      # "Vercel", so it cannot tell those two apart.
      - name: Wait for the Vercel production deployment
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            id=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=30" \
              --jq '[.[] | select((.environment // "") | ascii_downcase == "production")] | first | .id // empty')
            if [ -z "$id" ]; then
              echo "[$i] no production deployment for $SHA yet"
              sleep 20
              continue
            fi
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // "pending"')
            echo "[$i] production deployment $id: $state"
            case "$state" in
              success)
                echo "deployed=true" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              failure|error)
                gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].description // "no description"'
                echo "deployed=false" >> "$GITHUB_OUTPUT"
                echo "::warning::Skipping the OG cache warm: the Vercel production deployment for $SHA finished $state. Fix the deploy; this job is not the failure."
                exit 0 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out after 20 minutes waiting for a Vercel production deployment status on $SHA."
          exit 1

      - name: Fetch book slugs from production
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          set -euo pipefail
          # books.getAll is a public tRPC query — call with default input
          input='%7B%220%22%3A%7B%22json%22%3A%7B%7D%7D%7D'
          curl --fail-with-body -sSL \
            "https://chappyasel.com/api/trpc/books.getAll?batch=1&input=$input" \
            -o /tmp/books.json
          jq -r '.[0].result.data.json[].id' /tmp/books.json > /tmp/slugs.txt
          echo "Found $(wc -l < /tmp/slugs.txt) books"

      - name: Warm OG images (8 in parallel)
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          set -uo pipefail
          xargs -P 8 -I {} curl -sS \
            "https://books.chappyasel.com/{}/opengraph-image" \
            -A "OG-Warmer/1.0 (+https://github.com/${{ github.repository }})" \
            -o /dev/null \
            -w "%{http_code} %{time_total}s {}\n" \
            < /tmp/slugs.txt | tee /tmp/warm-results.txt
          fails=$(awk '$1 != 200 {print}' /tmp/warm-results.txt)
          if [ -n "$fails" ]; then
            echo "::warning::Some OG images failed to warm:"
            echo "$fails"
          fi
          echo "Warmed $(wc -l < /tmp/warm-results.txt) URLs"
