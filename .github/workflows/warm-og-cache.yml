name: Warm book OG image cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      # A failed deploy is the deploy's own red mark. This job used to fail
      # alongside it, which said "the OG warmer is broken" when the warmer had
      # simply been given nothing to warm. Report the deploy's own statuses and
      # stand down instead; a timeout still fails, because that one is ours.
      - name: Wait for Vercel production deploy
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" --jq '.state // "pending"')
            echo "[$i] Vercel status: $state"
            case "$state" in
              success)
                echo "deployed=true" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              failure|error)
                gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" --jq '.statuses[] | "\(.context): \(.description)"'
                echo "deployed=false" >> "$GITHUB_OUTPUT"
                echo "::warning::Skipping the OG cache warm: the production deploy for ${{ github.sha }} did not succeed. Fix the deploy; this job is not the failure."
                exit 0 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out after 20 minutes waiting for a Vercel status on ${{ github.sha }}."
          exit 1

      - name: Fetch book slugs from production
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          set -euo pipefail
          # books.getAll is a public tRPC query — call with default input
          input='%7B%220%22%3A%7B%22json%22%3A%7B%7D%7D%7D'
          curl --fail-with-body -sSL \
            "https://chappyasel.com/api/trpc/books.getAll?batch=1&input=$input" \
            -o /tmp/books.json
          jq -r '.[0].result.data.json[].id' /tmp/books.json > /tmp/slugs.txt
          echo "Found $(wc -l < /tmp/slugs.txt) books"

      - name: Warm OG images (8 in parallel)
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          set -uo pipefail
          xargs -P 8 -I {} curl -sS \
            "https://books.chappyasel.com/{}/opengraph-image" \
            -A "OG-Warmer/1.0 (+https://github.com/${{ github.repository }})" \
            -o /dev/null \
            -w "%{http_code} %{time_total}s {}\n" \
            < /tmp/slugs.txt | tee /tmp/warm-results.txt
          fails=$(awk '$1 != 200 {print}' /tmp/warm-results.txt)
          if [ -n "$fails" ]; then
            echo "::warning::Some OG images failed to warm:"
            echo "$fails"
          fi
          echo "Warmed $(wc -l < /tmp/warm-results.txt) URLs"
