name: Check Stacks quality contracts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stacks-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the revision
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Check Node version declarations
        run: node scripts/check-node-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same code gate developers run locally: types, strict lint, unit tests,
      # and the deterministic meadow contract. Generated-artifact freshness
      # has its own workflow because regeneration needs production data.
      - name: Check deterministic quality contracts
        run: pnpm verify
